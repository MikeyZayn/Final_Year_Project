<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEMBA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b132b; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .link-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); transition: background 0.15s; }
        .link-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .other-roles { display: none; }
        .other-roles.open { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-sm text-white text-center">
        <h1 class="text-2xl font-bold mb-1">THEMBA</h1>
        <p class="text-xs text-slate-400 mb-6">Transport Hub with Evaluated Mobility, Boarding and Accountability</p>

        <p class="text-sm mb-4">Welcome to THEMBA.</p>

        <div class="space-y-2">
            <a href="/accounts/register/passenger/" class="block rounded-xl px-4 py-3 text-sm font-bold bg-amber-500 hover:bg-amber-400 text-slate-950">
                Registration
            </a>
            <a href="/accounts/login/" class="link-btn block rounded-xl px-4 py-2 text-sm">
                Login
            </a>
        </div>
    </div>

    <div class="w-full max-w-sm mt-4 text-right">
        <button onclick="document.getElementById('other-roles').classList.toggle('open')" class="text-xs text-slate-300 underline hover:text-amber-400">
            Not a passenger? Register here
        </button>
        <div id="other-roles" class="other-roles glass-card rounded-2xl p-4 mt-2 text-left space-y-2">
            <a href="/accounts/register/driver/" class="link-btn block rounded-xl px-4 py-2 text-sm text-white">Register — Driver</a>
            <a href="/accounts/register/operator/" class="link-btn block rounded-xl px-4 py-2 text-sm text-white">Register — Operator</a>
        </div>
    </div>
</body>
</html>
