<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEMBA — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b132b; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; }
        .glass-input:focus { background: rgba(255, 255, 255, 0.15); border-color: #F39C12; outline: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-sm text-white">
        <h1 class="text-lg font-bold mb-4">Login</h1>
        <form method="post" class="space-y-3">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-[10px] text-rose-400 mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            {% if form.non_field_errors %}
                <p class="text-[10px] text-rose-400">{{ form.non_field_errors.0 }}</p>
            {% endif %}
            <button type="submit" class="w-full py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm mt-2">
                Login
            </button>
        </form>
    </div>
</body>
</html>
